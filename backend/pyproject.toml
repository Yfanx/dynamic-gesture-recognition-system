[project]
name = "dynamic-gesture-recognition-backend"
version = "1.0.0"
description = "FastAPI backend for an MMAction2 official dynamic gesture recognition demo."
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "python-multipart==0.0.20",
  "pydantic-settings==2.7.1",
  "numpy==2.2.1",
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "mmengine>=0.10.7",
  "mmcv-lite>=2.0.0rc4,<2.2.0",
  "mmaction2>=1.2.0",
  "decord>=0.6.0",
  "opencv-python>=4.13.0.92",
]

[tool.uv]
package = false
